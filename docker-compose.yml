services:
  redis:
    image: redis:7-alpine
    container_name: redis-student-demo
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  memcached:
    image: memcached:alpine
    container_name: redis-student-demo-memcached
    command: ["memcached", "-m", "64"]
    ports:
      - "127.0.0.1:${MEMCACHED_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\n' | nc 127.0.0.1 11211 | grep -q VERSION"]
      interval: 5s
      timeout: 3s
      retries: 10
